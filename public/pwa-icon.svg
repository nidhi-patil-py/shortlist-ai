<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with subtle squircle -->
  <rect width="512" height="512" rx="112" fill="url(#brandGrad)"/>

  <!-- Resume Document Graphic -->
  <g filter="url(#shadow)" transform="translate(106, 86)">
    <!-- Main Sheet -->
    <path d="M 0 20 C 0 9 9 0 20 0 L 200 0 L 300 100 L 300 320 C 300 331 291 340 280 340 L 20 340 C 9 340 0 331 0 320 Z" fill="#FFFFFF"/>
    
    <!-- Folded Corner -->
    <path d="M 200 0 L 300 100 L 220 100 C 209 100 200 91 200 80 Z" fill="#E0E7FF"/>

    <!-- Document Lines (Simulating Resume Sections) -->
    <!-- Name header line -->
    <rect x="36" y="44" width="130" height="18" rx="9" fill="#4F46E5"/>
    <!-- Title sub-line -->
    <rect x="36" y="74" width="80" height="10" rx="5" fill="#818CF8"/>

    <!-- Divider line -->
    <rect x="36" y="115" width="228" height="4" rx="2" fill="#E2E8F0"/>

    <!-- Content Lines -->
    <rect x="36" y="140" width="210" height="8" rx="4" fill="#94A3B8"/>
    <rect x="36" y="160" width="180" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="36" y="180" width="220" height="8" rx="4" fill="#CBD5E1"/>

    <!-- Section 2 -->
    <rect x="36" y="215" width="90" height="12" rx="6" fill="#4F46E5"/>
    <rect x="36" y="240" width="220" height="8" rx="4" fill="#94A3B8"/>
    <rect x="36" y="260" width="190" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="36" y="280" width="210" height="8" rx="4" fill="#CBD5E1"/>
  </g>

  <!-- ATS Verified Badge (Bottom Right) -->
  <g transform="translate(320, 320)">
    <circle cx="50" cy="50" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="8"/>
    <!-- Checkmark -->
    <path d="M 32 50 L 44 62 L 68 38" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
